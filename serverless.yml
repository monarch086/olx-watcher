service: olx-watcher
frameworkVersion: '4'

plugins:
  - serverless-multi-dotnet

provider:
  name: aws
  runtime: dotnet8
  region: ${opt:region, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  memorySize: 256
  timeout: 30
  environment:
    STAGE: ${sls:stage}
    WATCHED_PRODUCTS_TABLE: ${self:service}-${sls:stage}-watched-products
    TELEGRAM_BOT_TOKEN: ${env:TELEGRAM_BOT_TOKEN}
    TELEGRAM_WEBHOOK_SECRET: ${env:TELEGRAM_WEBHOOK_SECRET, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
          Resource:
            - Fn::GetAtt: [WatchedProductsTable, Arn]

package:
  individually: true

functions:
  listingsApi:
    handler: OlxWatcher.ListingsApi::OlxWatcher.ListingsApi.Function::FunctionHandler
    description: Processes Telegram commands for watched OLX products.
    package:
      artifact: src/OlxWatcher.ListingsApi/publish/deploy-package.zip
      projectFolder: src/OlxWatcher.ListingsApi
    events:
      - httpApi:
          method: POST
          path: /telegram/webhook
  listingsWatcher:
    handler: OlxWatcher.ListingsWatcher::OlxWatcher.ListingsWatcher.Function::FunctionHandler
    description: Periodically checks OLX listings.
    timeout: 60
    package:
      artifact: src/OlxWatcher.ListingsWatcher/publish/deploy-package.zip
      projectFolder: src/OlxWatcher.ListingsWatcher
    events:
      - schedule:
          rate: rate(15 minutes)
          enabled: true

resources:
  Resources:
    WatchedProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-watched-products
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: chatId
            AttributeType: S
          - AttributeName: productUrl
            AttributeType: S
        KeySchema:
          - AttributeName: chatId
            KeyType: HASH
          - AttributeName: productUrl
            KeyType: RANGE
