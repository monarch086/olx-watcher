# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: barsuk
service: olx-watcher

plugins:
  - ./serverless-dotnet-package.js

provider:
  name: aws
  runtime: dotnet8
  region: ${opt:region, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  memorySize: 256
  timeout: 30
  environment:
    STAGE: ${sls:stage}
    WATCHED_PRODUCTS_TABLE: ${self:service}-${sls:stage}-watched-products
    TELEGRAM_BOT_TOKEN: ${ssm:/olx-watcher/${sls:stage}/telegram-bot-token}
    TELEGRAM_WEBHOOK_SECRET: ${ssm:/olx-watcher/${sls:stage}/telegram-webhook-secret}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:UpdateItem
          Resource:
            - Fn::GetAtt: [WatchedProductsTable, Arn]

package:
  individually: true

functions:
  listingsApi:
    handler: OlxWatcher.ListingsApi::OlxWatcher.ListingsApi.Function::FunctionHandler
    description: Processes Telegram commands for watched OLX products.
    package:
      artifact: src/OlxWatcher.ListingsApi/publish/listings-api.zip
    events:
      - httpApi:
          method: POST
          path: /telegram/webhook
  listingsWatcher:
    handler: OlxWatcher.ListingsWatcher::OlxWatcher.ListingsWatcher.Function::FunctionHandler
    description: Periodically checks OLX listings.
    timeout: 300
    package:
      artifact: src/OlxWatcher.ListingsWatcher/publish/listings-watcher.zip
    events:
      - schedule:
          rate: cron(0 * * * ? *)
          enabled: true

resources:
  Resources:
    WatchedProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-watched-products
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: chatId
            AttributeType: S
          - AttributeName: productUrl
            AttributeType: S
        KeySchema:
          - AttributeName: chatId
            KeyType: HASH
          - AttributeName: productUrl
            KeyType: RANGE
